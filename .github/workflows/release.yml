name: Release

# Push a tag such as v0.17.0 to build installers for Windows, macOS and Linux and
# publish them as a GitHub release. "Run workflow" builds everything without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $version"; exit 1; }
          grep -q "## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          node -p "require('./extension/manifest.json').version" | grep -qx "$version" || { echo "extension/manifest.json version differs from $version"; exit 1; }

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64,    os: windows-latest,   target: win,   arch: x64 }
          - { name: mac-arm64,  os: macos-latest,     target: mac,   arch: arm64 }
          - { name: mac-x64,    os: macos-15-intel,   target: mac,   arch: x64 }
          - { name: linux-x64,  os: ubuntu-latest,    target: linux, arch: x64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: linux, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Linux packaging tools
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - name: System fpm (arm64 Linux has no bundled fpm)
        if: matrix.name == 'linux-arm64'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm --no-document
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Helper binaries (Windows, pinned versions and hashes)
        if: matrix.target == 'win'
        run: node scripts/ensure-vendor-binaries.mjs
      - name: Helper binaries (macOS and Linux)
        if: matrix.target != 'win'
        run: |
          npm install --no-save ffmpeg-static
          node build/fetch-vendor.mjs
      - name: Package
        run: npx electron-builder --config build/electron-builder.yml --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums, update feed and notes
        run: node build/release-assets.mjs "${GITHUB_REF_NAME#v}" artifacts "${GITHUB_REPOSITORY}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" $prerelease \
            --title "ZIVAR Download Manager ${GITHUB_REF_NAME}" \
            --notes-file artifacts/release-notes.md \
            artifacts/release-*/* artifacts/SHA256SUMS.txt artifacts/latest.json
