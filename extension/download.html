<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZIVAR Download Info</title>
  <link rel="stylesheet" href="download.css">
  <script src="i18n.js"></script><script src="download.js" defer></script>
</head>
<body>
  <main>
    <header class="top">
      <div class="brand"><span class="tile">Z</span><div><strong>ZIVAR</strong><small>Download Info</small></div></div>
      <span class="status-label">Browser</span>
    </header>

    <section class="card" aria-labelledby="title">
      <p class="eyebrow" data-i18n="info.eyebrow">New download detected</p>
      <h1 id="title" data-i18n="info.preparing">Preparing file information...</h1>
      <dl class="details">
        <div><dt data-i18n="info.size">Size</dt><dd id="size" data-i18n="info.checking">Checking...</dd></div>
        <div><dt data-i18n="info.type">Type</dt><dd id="type" data-i18n="info.checking">Checking...</dd></div>
        <div><dt data-i18n="info.source">Source</dt><dd id="source" data-i18n="info.checking">Checking...</dd></div>
      </dl>
      <p id="error" class="error" role="alert" hidden></p>
      <div class="actions">
        <button id="start" class="primary" type="button" disabled data-i18n="info.start">Start download</button>
        <button id="browser" class="ghost" type="button" disabled data-i18n="info.browser">Continue in Chrome</button>
      </div>
      <p class="note" data-i18n="info.note">Start download adds the file to the ZIVAR queue. Chrome will not save it a second time.</p>
    </section>
  </main>
</body>
</html>
